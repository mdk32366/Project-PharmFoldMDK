# Fly serving-tier config (DEP-001…004). `fly deploy --app pharmfoldmdk` builds the Dockerfile
# and releases the transport API. Always-on, no GPU (D-004). A green deploy means the transport
# is up and the queue accepts work — NOT that any fold has run (DEP-004); folds happen only when
# the owner starts the worker on the GPU box.
app = "pharmfoldmdk"
primary_region = "sjc"   # matches the MPG Postgres cluster's region (D-014).

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080          # matches the Dockerfile CMD (uvicorn --port 8080)
  force_https = true
  auto_stop_machines = "off"    # always-on serving tier (D-004): the worker polls it, so it
  auto_start_machines = true    # must stay reachable rather than scale to zero
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # ⚠⚠ 512mb → 1024mb (D-154), and the reason is a MEASURED kill rather than a precaution. On
  # 2026-09-10 15:37:17Z the machine was OOM-killed under an ordinary review session — flyd event
  # `exit_code=137, oom_killed=true, requested_stop=false`, the log line "Process appears to have
  # been OOM killed!", a reboot, and `/cancer-burden` answering HTTP 502 in a browser while it
  # happened. ⚠ THE MECHANISM IS PREDICTED, NOT MEASURED: `/api/census` builds a 7.1 MB JSON of
  # 3,467 rows on every `/census` view (1.29 MB gzipped, 5.4 s), which is the largest thing this
  # tier serves — but no peak-RSS number was taken from the running machine, so this doubles the
  # headroom and does NOT claim to have found the allocation. The payload itself is unchanged.
  memory = "1024mb"             # OWNER-tunable; the transport is I/O-bound, not compute

# Fold artifacts (structure.pdb / plddt.json / pae.json.gz / provenance.json) are written to a
# Fly Volume by the upload route (D-031); ARTIFACT_ROOT defaults to this mount (app/config.py).
[mounts]
  source = "artifacts"
  destination = "/data/artifacts"
